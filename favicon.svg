<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526" />
      <stop offset="50%" stop-color="#112038" />
      <stop offset="100%" stop-color="#070e1a" />
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(59,130,246,0.3)" stroke-width="6" />

  <!-- Background Glow Orb -->
  <circle cx="256" cy="256" r="150" fill="#2563eb" opacity="0.25" filter="url(#glow)" />

  <!-- Bus Silhouette / Body -->
  <g transform="translate(0, 8)">
    <!-- Bus Main Shell -->
    <rect x="120" y="110" width="272" height="250" rx="36" fill="url(#busGrad)" stroke="#60a5fa" stroke-width="4" />
    
    <!-- Windshield -->
    <path d="M 148 142 L 364 142 A 16 16 0 0 1 380 158 L 380 220 A 12 12 0 0 1 368 232 L 144 232 A 12 12 0 0 1 132 220 L 132 158 A 16 16 0 0 1 148 142 Z" fill="#0f172a" />
    <path d="M 152 148 L 360 148 A 12 12 0 0 1 372 160 L 372 216 L 140 216 L 140 160 A 12 12 0 0 1 152 148 Z" fill="#38bdf8" opacity="0.3" />
    <!-- Rear-view mirrors -->
    <rect x="94" y="172" width="16" height="42" rx="7" fill="#2563eb" stroke="#60a5fa" stroke-width="2" />
    <rect x="402" y="172" width="16" height="42" rx="7" fill="#2563eb" stroke="#60a5fa" stroke-width="2" />

    <!-- Fleet Badge / Destination sign -->
    <rect x="180" y="118" width="152" height="18" rx="5" fill="#0a1526" />
    <text x="256" y="131" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">DEVUSONS</text>

    <!-- Grille & Headlights -->
    <rect x="160" y="260" width="192" height="48" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <line x1="176" y1="276" x2="336" y2="276" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <line x1="176" y1="292" x2="336" y2="292" stroke="#334155" stroke-width="3" stroke-linecap="round" />

    <!-- Headlights -->
    <circle cx="150" cy="284" r="15" fill="#fef08a" filter="url(#glow)" />
    <circle cx="150" cy="284" r="10" fill="#ffffff" />
    <circle cx="362" cy="284" r="15" fill="#fef08a" filter="url(#glow)" />
    <circle cx="362" cy="284" r="10" fill="#ffffff" />

    <!-- Turn signals -->
    <rect x="138" y="316" width="24" height="8" rx="4" fill="url(#goldGrad)" />
    <rect x="350" y="316" width="24" height="8" rx="4" fill="url(#goldGrad)" />

    <!-- Bumper -->
    <rect x="110" y="338" width="292" height="24" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Wheels -->
    <rect x="142" y="356" width="46" height="36" rx="10" fill="#020617" />
    <rect x="324" y="356" width="46" height="36" rx="10" fill="#020617" />
    <circle cx="165" cy="374" r="7" fill="#64748b" />
    <circle cx="347" cy="374" r="7" fill="#64748b" />
  </g>

  <!-- Speed Dash lines -->
  <path d="M 80 430 L 432 430" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <path d="M 140 446 L 372 446" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
</svg>
